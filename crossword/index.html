<style>

  .gridbox{ width:min(94vw,540px); }
  .grid{ display:grid; grid-template-columns:repeat(15,1fr); border:2px solid var(--line); background:var(--line); gap:1px; user-select:none; }
  .cell{ background:#fff; aspect-ratio:1/1; position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cell.black{ background:#222; cursor:default; }
  .cell .num{ position:absolute; top:0; left:2px; font-size:clamp(7px,1.6vw,10px); line-height:1.2; color:#333; }
  .cell .ch{ font-size:clamp(11px,3.2vw,21px); font-weight:600; }
  .cell.hl{ background:var(--hl); }
  .cell.cur{ background:var(--hl2); }
  .cell.ok .ch{ color:var(--ok); }
  .cell.bad{ background:#fbe4e4; }
  .cell.bad .ch{ color:var(--bad); }
  .cell.rev .ch{ color:var(--rev); }
  .entrybox{ margin-top:12px; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; background:#fff; }
  .entrybox .eclue{ font-size:14px; margin-bottom:8px; min-height:20px; }
  .entrybox input{ width:100%; font-size:20px; padding:9px 10px; border:1.5px solid #999; border-radius:6px; letter-spacing:2px; }
  .tools{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; justify-content:center; }
  .banner{ display:none; margin-top:12px; text-align:center; font-size:17px; font-weight:700; color:var(--ok); }
  .clues{ width:min(94vw,400px); display:flex; gap:18px; }
  .clues .col{ flex:1; }
  .clues h3{ margin:2px 0 8px; font-size:16px; border-bottom:2px solid var(--line); padding-bottom:4px; }
  .clue{ font-size:13.5px; padding:5px 6px; border-radius:5px; cursor:pointer; line-height:1.45; }
  .clue:hover{ background:#f3efdf; }
  .clue.sel{ background:var(--hl); }
  .clue b{ margin-right:4px; }
  footer{ text-align:center; color:#888; font-size:12px; padding:16px 0 26px; }
  @media (max-width:760px){ .clues{ flex-direction:column; gap:6px; } }
</style>
</head>

const N = 15;
const key = (r,c)=>r+','+c;
let pIdx = PUZZLES.length-1;
let sol={}, wordList=[], wordNum={}, numAt={}, cover={};
let entry={}, locked={}, selWi=-1, selCell=null;
const $ = id=>document.getElementById(id);

function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function saveProg(){ const p=PUZZLES[pIdx]; store(CFG.lsPrefix+p.no, {entry, locked}); }
function loadProg(){ const p=PUZZLES[pIdx]; const s=store(CFG.lsPrefix+p.no); entry = s&&s.entry?s.entry:{}; locked = s&&s.locked?s.locked:{}; }

function wordCells(w){ const out=[]; const L=[...w.w].length; for(let i=0;i<L;i++){ out.push([w.r+(w.d==='D'?i:0), w.c+(w.d==='A'?i:0)]); } return out; }

function build(){
  const p = PUZZLES[pIdx];
  sol={}; cover={}; wordList=p.words.map((w,i)=>({...w, _i:i}));
  wordList.forEach(w=>{ [...w.w].forEach((ch,i)=>{ const r=w.r+(w.d==='D'?i:0), c=w.c+(w.d==='A'?i:0); sol[key(r,c)]=ch; (cover[key(r,c)]=cover[key(r,c)]||[]).push(w._i); }); });
  const starts={};
  wordList.forEach(w=>{ starts[key(w.r,w.c)]=true; });
  numAt={}; let n=0;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(starts[key(r,c)]) numAt[key(r,c)]=++n;
  wordNum={}; wordList.forEach(w=>{ wordNum[w._i]=numAt[key(w.r,w.c)]; });
  loadProg();
  $('meta').innerHTML = '<b>No. '+p.no+'</b> · '+p.date+' · '+escapeHtml(p.theme_line)+' · '+escapeHtml(p.level);
  renderGrid(); renderClues();
  const firstA = wordList.find(w=>w.d==='A') || wordList[0];
  selectWord(firstA._i, false);
  updateBanner();
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderGrid(){
  const g=$('grid'); g.innerHTML='';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const d=document.createElement('div');
    if(!(key(r,c) in sol)){ d.className='cell black'; }
    else{
      d.className='cell'; d.dataset.r=r; d.dataset.c=c;
      if(numAt[key(r,c)]){ const s=document.createElement('span'); s.className='num'; s.textContent=numAt[key(r,c)]; d.appendChild(s); }
      const ch=document.createElement('span'); ch.className='ch'; ch.id='ch-'+r+'-'+c; d.appendChild(ch);
      d.addEventListener('click', ()=>onCell(r,c));
    }
    g.appendChild(d);
  }
  refreshCells();
}
function refreshCells(){
  for(const k in sol){
    const [r,c]=k.split(',').map(Number);
    const cell=document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    const ch=$('ch-'+r+'-'+c);
    if(ch) ch.textContent = entry[k]||'';
    if(cell){ cell.classList.toggle('rev', !!locked[k]); }
  }
}
function renderClues(){
  const mk = dir => wordList.filter(w=>w.d===dir).sort((a,b)=>wordNum[a._i]-wordNum[b._i]).map(w=>
    '<div class="clue" data-wi="'+w._i+'" id="clue-'+w._i+'"><b>'+wordNum[w._i]+'.</b>'+escapeHtml(w.clue)+'</div>').join('');
  $('cluesA').innerHTML = mk('A'); $('cluesD').innerHTML = mk('D');
  document.querySelectorAll('.clue').forEach(el=>el.addEventListener('click', ()=>selectWord(+el.dataset.wi, true)));
}
function onCell(r,c){
  const ws = cover[key(r,c)]||[];
  if(!ws.length) return;
  if(selWi>=0 && ws.includes(selWi) && ws.length>1){ selectWord(ws.find(i=>i!==selWi), true); }
  else if(selWi>=0 && ws.includes(selWi)){ selectWord(selWi, true); }
  else selectWord(ws[0], true);
  selCell=[r,c]; markSel();
}
function selectWord(wi, focus){
  selWi=wi;
  const w=wordList[wi];
  selCell = wordCells(w)[0];
  markSel();
  $('eclue').innerHTML = '<b>'+wordNum[wi]+(w.d==='A'?CFG.across:CFG.down)+'</b> '+escapeHtml(w.clue);
  syncEntryField();
  if(focus) $('entry').focus();
}
function markSel(){
  document.querySelectorAll('.cell').forEach(el=>el.classList.remove('hl','cur'));
  document.querySelectorAll('.clue').forEach(el=>el.classList.toggle('sel', +el.dataset.wi===selWi));
  if(selWi<0) return;
  wordCells(wordList[selWi]).forEach(([r,c])=>{
    const cell=document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    if(cell) cell.classList.add('hl');
  });
  if(selCell){ const cell=document.querySelector('.cell[data-r="'+selCell[0]+'"][data-c="'+selCell[1]+'"]'); if(cell) cell.classList.add('cur'); }
  const cl=$('clue-'+selWi); if(cl) cl.scrollIntoView({block:'nearest'});
}
function wordString(w){
  return wordCells(w).map(([r,c])=> entry[key(r,c)]||'').join('');
}
function syncEntryField(){ if(selWi>=0) $('entry').value = wordString(wordList[selWi]); }
function normalize(s){
  s = s.replace(/\s+/g,'');
  if(CFG.en) s = s.toUpperCase().replace(/[^A-Z]/g,'');
  return [...s];
}
$('entry').addEventListener('input', ()=>{
  if(selWi<0) return;
  const w=wordList[selWi]; const cells=wordCells(w); const chars=normalize($('entry').value);
  cells.forEach(([r,c],i)=>{
    const k=key(r,c);
    if(locked[k]) return;
    entry[k] = chars[i]||'';
    const cell=document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    if(cell) cell.classList.remove('ok','bad');
  });
  // keep locked letters visible at their positions in the field
  if(cells.some(([r,c])=>locked[key(r,c)])) syncEntryField();
  refreshCells(); saveProg(); updateBanner();
});
function isSolved(){ return Object.keys(sol).every(k=> entry[k]===sol[k]); }
function updateBanner(){ $('banner').style.display = isSolved() ? 'block':'none'; }
$('checkBtn').addEventListener('click', ()=>{
  for(const k in sol){
    const [r,c]=k.split(',').map(Number);
    const cell=document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    if(!cell) continue;
    cell.classList.remove('ok','bad');
    if(entry[k]) cell.classList.add(entry[k]===sol[k] ? 'ok':'bad');
  }
  updateBanner();
});
function revealCells(list){
  list.forEach(([r,c])=>{ const k=key(r,c); entry[k]=sol[k]; locked[k]=true; });
  refreshCells(); syncEntryField(); saveProg(); updateBanner();
}
$('revLetterBtn').addEventListener('click', ()=>{
  let target=null;
  if(selCell){ const k=key(selCell[0],selCell[1]); if(entry[k]!==sol[k]) target=selCell; }
  if(!target && selWi>=0){ const cs=wordCells(wordList[selWi]); target=cs.find(([r,c])=>entry[key(r,c)]!==sol[key(r,c)])||null; }
  if(!target){ for(const k in sol){ if(entry[k]!==sol[k]){ target=k.split(',').map(Number); break; } } }
  if(target) revealCells([target]);
});
$('revWordBtn').addEventListener('click', ()=>{ if(selWi>=0) revealCells(wordCells(wordList[selWi])); });
$('revAllBtn').addEventListener('click', ()=>{ revealCells(Object.keys(sol).map(k=>k.split(',').map(Number))); });
$('clearBtn').addEventListener('click', ()=>{
  for(const k in sol) if(!locked[k]) entry[k]='';
  document.querySelectorAll('.cell').forEach(el=>el.classList.remove('ok','bad'));
  refreshCells(); syncEntryField(); saveProg(); updateBanner();
});
// picker
const picker=$('picker');
PUZZLES.forEach((p,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent='No. '+p.no+' · '+p.date+' · '+p.theme_line; picker.appendChild(o); });
picker.value=pIdx;
picker.addEventListener('change', ()=>{ pIdx=+picker.value; build(); });
$('prevBtn').addEventListener('click', ()=>{ if(pIdx>0){ pIdx--; picker.value=pIdx; build(); } });
$('nextBtn').addEventListener('click', ()=>{ if(pIdx<PUZZLES.length-1){ pIdx++; picker.value=pIdx; build(); } });
build();
</script>
</body>
</html>
